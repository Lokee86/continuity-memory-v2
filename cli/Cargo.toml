[package]
name = "reliquary-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "reliquary"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
reliquary-memory = { path = ".." }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
