[package]
name = "reliquary-memory"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lodestone-packed = { git = "https://github.com/Lokee86/lodestone.git", rev = "7b4b3e02b2bd3f3e474fef1a31c8632f8bbea49f" }
sha2 = "0.10"
serde_json = "1"
aes-gcm = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
