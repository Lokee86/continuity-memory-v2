[package]
name = "reliquary-memory"
version = "0.1.0"
edition = "2024"
publish = false

[features]
community-benchmarks = []
entity-calibration = []

[[example]]
name = "entity_calibration_run"
path = "examples/entity_calibration_run/main.rs"
required-features = ["entity-calibration"]

[[example]]
name = "entity_calibration_distribution"
path = "examples/entity_calibration_distribution/main.rs"
required-features = ["entity-calibration"]

[dependencies]
arcana = { git = "https://github.com/Lokee86/lexicon-arcana.git", rev = "9ebccd6e7d089b98a8992c5451ba57f903f295fb" }
lodestone-packed = { git = "https://github.com/Lokee86/lodestone.git", rev = "7b4b3e02b2bd3f3e474fef1a31c8632f8bbea49f" }
sha2 = "0.10"
serde_json = "1"
aes-gcm = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
regex = "1"
leiden-rs = { version = "0.8.1", default-features = false }
time = { version = "0.3", features = ["parsing"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
