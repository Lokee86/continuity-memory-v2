[package]
name = "reliquary-memory"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arcana-graph = { git = "https://github.com/Lokee86/grimoire.git", rev = "0f30d0bc53c58b0b04b1a17a812784a797ee216b" }
lodestone-packed = { git = "https://github.com/Lokee86/lodestone.git", rev = "7b4b3e02b2bd3f3e474fef1a31c8632f8bbea49f" }
sha2 = "0.10"
serde_json = "1"
aes-gcm = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
regex = "1"
leiden-rs = { version = "0.8.1", default-features = false }
time = { version = "0.3", features = ["parsing"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
